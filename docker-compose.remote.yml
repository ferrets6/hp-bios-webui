# Remote deploy mode: the container runs on a different machine than the
# one with the hp-bioscfg sysfs interface (e.g. this on a Raspberry Pi,
# controlling a separate NAS over SSH). Requires the NAS_* vars in .env -
# see .env.example.
#
#   docker compose -f docker-compose.yml -f docker-compose.remote.yml up -d --build
#
services:
  bios-webui:
    environment:
      NAS_HOST: ${NAS_HOST}
      NAS_USER: ${NAS_USER}
      NAS_SSH_PORT: ${NAS_SSH_PORT:-22}
      NAS_SSH_KEY_PATH: /run/secrets/nas_ssh_key
      NAS_CTL_PATH: ${NAS_CTL_PATH}
    volumes:
      - ${NAS_SSH_KEY_HOST_PATH}:/run/secrets/nas_ssh_key:ro
