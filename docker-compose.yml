services:
  bios-webui:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: hp-bios-webui:local
    container_name: hp-bios-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-8088}:8000"
    environment:
      # All optional - unset OIDC_ISSUER_URL (the default) disables OIDC
      # auth entirely, with no behavior change. See .env.example and
      # README.md's Authentication section.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-3600}
